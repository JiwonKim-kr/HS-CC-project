<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0c18">
  <title>도트 유체</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4' shape-rendering='crispEdges'%3E%3Crect width='4' height='4' fill='%230a0c18'/%3E%3Crect x='1' y='0' width='1' height='1' fill='%2322d3ee'/%3E%3Crect x='0' y='1' width='2' height='1' fill='%2334d399'/%3E%3Crect x='1' y='2' width='2' height='1' fill='%2322d3ee'/%3E%3Crect x='2' y='3' width='1' height='1' fill='%23a78bfa'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view" aria-label="함께 쏟아 섞는 도트 유체"></canvas>

  <header class="hud">
    <div class="panel">
      <h1>도트 유체</h1>
      <p class="row">
        <span id="swatch" class="swatch" title="내 색"></span>
        <span id="status">연결 중…</span>
      </p>
      <p class="row"><span id="count">1</span>명 접속 중</p>
    </div>

    <div class="panel">
      <label class="row" for="quality">화질
        <select id="quality">
          <option value="auto">자동</option>
          <option value="high">높음</option>
          <option value="mid">보통</option>
          <option value="low">낮음</option>
          <option value="min">최저</option>
        </select>
      </label>
      <p class="row dim"><span id="grid">–</span> · <span id="fps">–</span>fps</p>
      <button id="share" type="button">QR로 초대</button>
    </div>
  </header>

  <div id="qr" class="qr" hidden>
    <div class="qr-card">
      <img id="qr-img" alt="접속 QR 코드" width="260" height="260">
      <p id="qr-url" class="qr-url"></p>
      <p class="dim">아무 곳이나 누르면 닫힙니다</p>
    </div>
  </div>

  <p id="hint" class="hint">화면을 누르고 있으면 유체가 쏟아집니다</p>

  <script type="module" src="main.js"></script>
</body>
</html>
